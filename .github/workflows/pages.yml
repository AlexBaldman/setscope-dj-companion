name: Deploy SetScope to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify
        run: npm run check && npm run smoke
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify browser and build Pages artifact
        run: npm run test:runtime
        env:
          SETSCOPE_API_BASE_URL: ${{ vars.SETSCOPE_API_BASE_URL }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed app
        run: npm run canary
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
